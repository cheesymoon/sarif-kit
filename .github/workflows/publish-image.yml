# Builds the image the Action runs and pushes it to GHCR under the branch
# name, which is how a change to the image gets tried out before it ships.
# Release images are built by release.yml, not here: release tags are pushed
# with the workflow's own token, and such pushes never trigger this workflow.
#
# The package has to be public for the Action to work outside this org: the
# runner pulls it without credentials. Set that once under the org's package
# settings after the first publish.
name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the branch name as the image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
