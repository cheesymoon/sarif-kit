# Builds the image the Action runs and pushes it to GHCR.
#
# A tag push publishes the release version (v0.1.0 becomes the image tag 0.1.0),
# which is what action.yml pins. Running it by hand from a branch publishes under
# the branch name instead, which is how a change to the image gets tried out
# before it is tagged.
#
# The package has to be public for the Action to work outside this org: the
# runner pulls it without credentials. Set that once under the org's package
# settings after the first publish.
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out the image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
