# Step-2 end-to-end gate: prove that GitHub Code Scanning actually accepts sarif-kit
# output, since a schema-valid file can still be rejected. Run it manually ("Run
# workflow" in the Actions tab) on a repo with Code Scanning enabled, then look under
# Security > Code scanning for the alert with a clickable README.md:1 link.
name: Upload gate

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  upload-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync
      - name: Build gate SARIF
        run: uv run python scripts/gate_minimal_sarif.py gate.sarif
      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gate.sarif
          category: sarif-kit-gate
